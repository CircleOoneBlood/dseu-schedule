# Build the site from the newest Excel in data/excel/ and publish it to GitHub Pages
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # commit times pick the newest uploaded workbook
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5
      - name: Excel → CSV
        run: python scripts/xlsx_to_csv.py
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html CNAME _site/
          mkdir _site/data && cp data/*.csv _site/data/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
