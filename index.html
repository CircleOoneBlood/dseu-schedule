.bg::after{content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(70,130,235,.22), transparent 60%),
    linear-gradient(180deg, rgba(8,24,70,.08) 0%, rgba(8,24,70,.28) 45%, rgba(6,18,52,.5) 100%);}

.wrap{max-width:920px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header{padding:40px 0 28px;text-align:center}
.logo{display:inline-flex;align-items:flex-end;gap:10px;margin-bottom:18px}
.logo img{height:74px;width:auto;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.25))}
.lw{display:flex;flex-direction:column;align-items:stretch;text-align:left}
.lt{display:flex;align-items:center;gap:7px}
.dseu{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900;font-size:44px;line-height:.9;color:#E0291F;letter-spacing:-.01em}
.len{font-size:10.5px;line-height:1.12;font-weight:600;color:#fff}
.lcn{margin-top:5px;font-size:19px;font-weight:600;color:#fff;letter-spacing:.14em;white-space:nowrap}
.uni2{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:13px;letter-spacing:.16em;font-weight:700}
.pill-red{background:var(--red);color:#fff;padding:3px 10px;border-radius:3px}
h1{margin:18px 0 8px;font-size:clamp(28px,4.6vw,42px);font-weight:800;letter-spacing:.04em;text-shadow:0 2px 18px rgba(0,0,0,.35)}
h1 .nw{white-space:nowrap}
:lang(en) h1{letter-spacing:.01em;font-size:clamp(26px,4.2vw,40px)}
:lang(en) h1 .nw{display:block;white-space:normal}
:lang(en) h1 .sep{display:none}
.sub{color:var(--muted);font-size:17.5px;letter-spacing:.06em}

/* ---------- sticky control bar ---------- */
.bar{position:sticky;top:0;z-index:20;padding:12px 0 0;background:transparent;transition:background .25s,backdrop-filter .25s}
/* blends into the page at rest; only once content scrolls under it does it frost so text stays legible */
.bar.stuck{background:rgba(20,48,110,.35);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2)}
.controls{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ctl-right{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:16.5px;font-weight:600;
  padding:8px 17px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .2s,background .2s}
.seg.mode button{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:6px 18px;min-width:96px}
.seg.mode button small{font-size:12px;font-weight:600;opacity:.72;margin-top:3px}
.seg.lang button{font-size:14.5px;padding:8px 12px;min-width:42px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:#0B1B44;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.clock{font-size:15px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.clock b{color:var(--ink);font-weight:700}
.btn{appearance:none;font:inherit;font-size:15.5px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.15)}
.btn svg{width:15px;height:15px}
.btn.icon{width:40px;height:40px;padding:0;justify-content:center}
.btn.icon svg{width:19px;height:19px}

.tabs{display:flex;gap:7px;overflow-x:auto;padding:11px 0 11px;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;scroll-snap-align:start;appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);
  font:inherit;cursor:pointer;border-radius:12px;padding:8px 6px;text-align:center;min-width:78px;transition:background .2s,color .2s,border-color .2s}
.tab .t1{display:block;font-size:14.5px;font-weight:800;letter-spacing:.06em}
.tab .t2{display:block;font-size:15.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.tab:hover{background:rgba(255,255,255,.1);color:var(--ink)}
.tab[aria-selected="true"]{background:#fff;color:#0B1B44;border-color:#fff}
.tab .today{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:5px;vertical-align:middle}

/* ---------- day panel ---------- */
main{padding:24px 0 40px}
.day + .day{margin-top:40px}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.dayhead .k{font-size:15px;letter-spacing:.2em;color:var(--faint);font-weight:800}
.dayhead h2{margin:4px 0 0;font-size:34px;font-weight:800;letter-spacing:.02em}
.dayhead .conv{font-size:14.5px;color:var(--muted);text-align:right;line-height:1.6}
.tzpill{display:inline-block;font-size:14.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--line);letter-spacing:.04em}
.print-title{display:none}

/* time tree: [time labels][rail][cards] */
.row{position:relative;display:grid;grid-template-columns:var(--tcol) var(--rcol) 1fr;column-gap:12px}
.colhead{margin-bottom:6px}
.colhead .cols{grid-column:3;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.colhead span{font-size:14.5px;font-weight:800;letter-spacing:.22em;color:var(--faint);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}

.tl{text-align:right;font-variant-numeric:tabular-nums;padding-top:9px}
.tl .s{font-size:25px;font-weight:800;line-height:1.1}
.tl .e{font-size:16.5px;color:var(--muted);margin-top:4px}
.tl .d{display:inline-block;white-space:nowrap;margin-top:7px;font-size:13.5px;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 7px}

.rail{position:relative}
.rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(255,255,255,.22)}
.row.first .rail::before{top:16px}
.row.last .rail::before{bottom:auto;height:16px}
.row.only .rail::before{display:none}
.dot{position:absolute;left:50%;top:10px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#0B1B44;border:3px solid var(--c);box-shadow:0 0 0 4px rgba(10,28,74,.6)}
.gap .rail::before{background:repeating-linear-gradient(180deg,rgba(255,255,255,.22) 0 5px,transparent 5px 10px)}
.gapt{grid-column:3;align-self:center;font-size:15px;color:var(--faint);padding:10px 2px;letter-spacing:.04em}
.gap .tl{padding-top:0}

.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:16px}
.card{--c:var(--c-gen);position:relative;
  background:rgba(14,32,80,.55);
  background:color-mix(in srgb, var(--c) 16%, rgba(14,32,80,.55));
  border:1px solid rgba(255,255,255,.16);
  border:1px solid color-mix(in srgb, var(--c) 36%, transparent);
  border-radius:var(--radius);padding:12px 15px 12px 32px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-height:58px;
  display:flex;flex-direction:column;justify-content:center}
.card::before{content:"";position:absolute;left:14px;top:50%;margin-top:-4.5px;width:9px;height:9px;border-radius:50%;background:var(--c)}
.card .zh{font-size:19.5px;font-weight:700;line-height:1.4}
.card .badge{display:none;font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--c);margin-bottom:4px}
.card.audit{background:rgba(14,32,80,.3);border:1px dashed rgba(255,255,255,.18)}
.card.audit .zh{font-weight:600;color:var(--muted)}
.card.free{background:rgba(14,32,80,.2);border:1px dashed rgba(255,255,255,.16)}
.card.free::before{background:transparent;border:1.5px solid var(--faint);width:7px;height:7px}
.card.free .zh{color:var(--faint);font-weight:600}
.ph{border:1px dashed rgba(255,255,255,.07);border-radius:var(--radius)}

/* current-time marker on the tree */
.nowm{position:absolute;left:0;right:0;height:0;z-index:5;pointer-events:none;
  display:grid;grid-template-columns:var(--tcol) var(--rcol) 1fr;column-gap:12px;align-items:center}
.nowm .np{justify-self:end;transform:translateY(-50%);background:var(--now);color:#fff;font-size:14.5px;font-weight:800;border-radius:999px;padding:3px 10px;
  font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 4px 14px rgba(255,90,78,.45)}
.nowm .nd{justify-self:center;width:12px;height:12px;border-radius:50%;background:var(--now);transform:translateY(-50%);box-shadow:0 0 0 5px rgba(255,90,78,.25)}
.nowm .nl{height:2px;transform:translateY(-50%);background:linear-gradient(90deg,var(--now),rgba(255,90,78,.35) 40%,transparent)}
.nowrow{height:30px}
@media (min-width:1120px){.nowm .np{justify-self:start;transform:translate(calc(-100% - 14px),-50%)}}

.c-gmr{--c:var(--c-gmr)}.c-med{--c:var(--c-med)}.c-rox{--c:var(--c-rox)}.c-dhd{--c:var(--c-dhd)}
.c-act{--c:var(--c-act)}.c-gen{--c:var(--c-gen)}.c-audit{--c:var(--c-audit)}.c-free{--c:var(--c-free)}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.pager button{appearance:none;font:inherit;font-size:16.5px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);
  border-radius:999px;padding:10px 18px;cursor:pointer}
.pager button:hover{background:rgba(255,255,255,.14)}
.pager button:disabled{opacity:.3;cursor:default}

/* ---------- overview ---------- */
.ov{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}
.panel{background:rgba(14,32,80,.5);border:1px solid var(--line);border-radius:18px;padding:18px 20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.panel h3{margin:0 0 12px;font-size:15px;letter-spacing:.16em;color:var(--faint);font-weight:800}
.trip{list-style:none;margin:0;padding:0}
.trip li{display:grid;grid-template-columns:44px 60px 1fr;gap:10px;align-items:center;padding:11px 0;border-top:1px solid rgba(255,255,255,.07);font-size:18px}
.trip li:first-child{border-top:0}
.trip .dw{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--faint)}
.trip .dt{font-variant-numeric:tabular-nums;color:var(--muted)}
.trip .ev small{display:block;color:var(--faint);font-size:14.5px}
.trip li.link{cursor:pointer}
.trip li.link:hover .ev{color:#fff;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.35)}
.trip .go{font-size:13.5px;color:var(--faint);margin-left:6px}
.cnt{width:100%;border-collapse:collapse;font-size:17px}
.cnt td{padding:9px 0;border-top:1px solid rgba(255,255,255,.07)}
.cnt tr:first-child td{border-top:0}
.cnt td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;width:40px}
.cnt small{display:block;color:var(--faint);font-size:13px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;font-size:15.5px;color:var(--muted)}
.legend span{display:flex;gap:8px;align-items:center}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:0 0 auto}
.stack{display:grid;gap:16px;align-content:start}

footer{color:var(--faint);font-size:14.5px;text-align:center;padding:10px 0 40px;line-height:1.8}

/* ---------- mobile ---------- */
@media (max-width:720px){
  :root{--tcol:76px;--rcol:22px}
  .wrap{padding:0 16px}
  header{padding:28px 0 18px}
  .logo img{height:62px}
  .dseu{font-size:37px}
  .lcn{font-size:16px}
  .uni2{font-size:11px}
  .row{column-gap:8px}
  .colhead{display:none}
  .tl .s{font-size:20px}
  .tl .e{font-size:15px}
  .tl .d{font-size:12px;padding:1px 4px}
  .dot{width:14px;height:14px;margin-left:-7px}
  .cells{grid-template-columns:1fr}
  .cells .card{grid-column:auto!important}
  .cells .ph{display:none}
  .card .badge{display:block}
  .card .zh{font-size:18.5px}
  .nowm .np{font-size:12px;padding:2px 7px}
  .ov{grid-template-columns:1fr}
  .dayhead .conv{text-align:left}
  .clock{display:none}
  .seg.mode button{font-size:15px;padding:5px 12px;min-width:0}
  .seg.mode button small{font-size:11px}
  .seg.lang button{font-size:13.5px;padding:7px 9px;min-width:34px}
  .btn.icon{width:36px;height:36px}
  .controls{gap:8px;justify-content:space-between;flex-wrap:nowrap}
  .ctl-right{gap:8px;flex-wrap:nowrap}
  h1 .sep{display:none}
  h1 .nw{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- print: one day per A4 page, same look as the screen ---------- */
@page{size:A4 portrait;margin:0}
@media print{
  :root{--tcol:74px;--rcol:22px}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bg{background-position:center 70%}
  body{font-size:12px}
  header,.bar,.pager,footer,.nowm,.nowrow{display:none!important}
  .wrap{max-width:none;padding:0 13mm}
  main{padding:0}
  .day{padding:11mm 0 8mm}
  .day + .day{margin-top:0}
  .card,.panel,.bar{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  .print-title{display:flex;align-items:center;gap:10px;padding-bottom:9px;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,.25)}
  .print-title img{height:36px}
  .print-title .pt1{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:#fff;opacity:.8}
  .print-title .pt2{font-size:17px;font-weight:800;color:#fff}
  .dayhead{margin-bottom:10px}
  .dayhead h2{font-size:25px}
  .dayhead .k{font-size:12px}
  .colhead{display:grid!important}
  .colhead span{font-size:11.5px}
  .row{break-inside:avoid;column-gap:8px}
  .tl{padding-top:7px}
  .tl .s{font-size:18px}
  .tl .e{font-size:13px}
  .tl .d{font-size:11px;padding:0 5px}
  .dot{width:13px;height:13px;margin-left:-6.5px;top:9px;border-width:2.5px;box-shadow:none}
  .cells{grid-template-columns:repeat(3,1fr)!important;gap:6px;padding-bottom:9px}
  .cells .card{grid-column:var(--gc)!important}
  .cells .ph{display:block!important}
  .card{min-height:0;padding:8px 10px 8px 24px;border-radius:10px;background:color-mix(in srgb, var(--c) 18%, rgba(14,32,80,.78))}
  .card.audit,.card.free{background:rgba(14,32,80,.5)}
  .card::before{left:10px;width:7px;height:7px;margin-top:-3.5px}
  .card .zh{font-size:15px}
  .card .badge{display:none!important}
  .gapt{font-size:12px;padding:6px 2px}
  .ov{grid-template-columns:1fr 1fr}
  .panel{background:rgba(14,32,80,.75)}
}
</style>

  for (const [s, e, cells, flag] of day.slots){
    const bs = wall(abs('az', day.d, s), 'bj'), be = wall(abs('az', day.d, e), 'bj');
    if (bs.getUTCHours() < EARLIEST_BJ) continue;
    const isLive = flag === live;
    if (!isLive && !cells.some(([ev]) => COURSE.has(ev.cat))) continue;
    const keep = isLive ? cells : cells.filter(([ev]) => COURSE.has(ev.cat) || ev.cat === 'audit');
    d = d || bs.getUTCDate();
    slots.push([hm(bs), hm(be), keep, flag]);
  }
  return {n: day.n, d, slots};
}).filter(day => day.slots.length);

  const w = wall(Date.now(), z);

  const i = SCHED[z].findIndex(x => x.d === w.getUTCDate());
  return i >= 0 ? i + 1 : -1;
}

  const h = Math.floor(m/60), r = m%60;
  if (lang === 'en') return [h ? h+' h' : '', r ? r+' min' : ''].filter(Boolean).join(' ');
  const H = lang === 'zt' ? '小時' : '小时', M = lang === 'zt' ? '分鐘' : '分钟';
  return h ? (h+H+(r ? r+'分' : '')) : r+M;
};

    const d = dateOf(day), p = i + 1;
    html += `<button class="tab" role="tab" data-p="${p}" aria-selected="${page===p}">
      <span class="t1">DAY ${day.n}${p===tn?`<i class="today" title="${esc(t('today'))}"></i>`:''}</span>
      <span class="t2">${md(d)} ${week(d)}</span></button>`;
  });
  $('#tabs').innerHTML = html;
  // scroll only the tab strip, never the page
  const sel = $('#tabs [aria-selected="true"]'), strip = $('#tabs');
  if (sel) strip.scrollTo({left: sel.offsetLeft - strip.offsetLeft - (strip.clientWidth - sel.offsetWidth)/2, behavior:'smooth'});
}

function cardHTML(ev, col, span){
  const badge = span === 3 ? '' : TRACKS.slice(col, col+span).join(' · ');
  const cls = ['card','c-'+ev.cat, ev.cat==='audit'?'audit':'', ev.cat==='free'?'free':''].join(' ');
  const gc = `${col+1} / span ${span}`;
  return `<div class="${cls}" style="grid-column:${gc};--gc:${gc}">
    ${badge?`<div class="badge">${badge}</div>`:''}
    <div class="zh">${esc(nm(ev))}</div>
  </div>`;
}

function nowMarker(ms, top){
  return `<div class="nowm" id="nowm" style="top:${top}"><span class="np">${esc(t('now'))} ${hm(wall(ms, tz))}</span><span class="nd"></span><span class="nl"></span></div>`;
}

function renderDay(day, withNow){
  const now = Date.now();
  const first = dateOf(day);

  // build tree rows: slots plus the free gaps between them
  const items = [];
  let lastEnd = null;
  for (const [s, e, cells] of day.slots){
    const a = abs(tz, day.d, s), b = abs(tz, day.d, e);
    if (lastEnd !== null && a - lastEnd >= 10*60000) items.push({gap:true, a:lastEnd, b:a});
    items.push({a, b, s, e, cells});
    lastEnd = lastEnd === null ? b : Math.max(lastEnd, b);
  }

  // where does "now" fall? (only within this calendar day of the schedule's zone)
  const dayStart = abs(tz, day.d, '00:00'), dayEnd = dayStart + 86400000;
  let nowIdx = -2, nowFrac = 0;
  if (withNow && now >= dayStart && now < dayEnd){
    if (now < items[0].a) nowIdx = -1;
    else {
      nowIdx = items.findIndex(it => now >= it.a && now < it.b);
      if (nowIdx >= 0) nowFrac = (now - items[nowIdx].a) / (items[nowIdx].b - items[nowIdx].a);
      else nowIdx = items.length;
    }
  }

  let rows = nowIdx === -1 ? `<div class="row nowrow">${nowMarker(now,'50%')}</div>` : '';
  items.forEach((it, i) => {
    const pos = (i===0?' first':'') + (i===items.length-1 && nowIdx !== items.length?' last':'') + (items.length===1?' only':'');
    // slot rows carry 16px of bottom spacing under the cards; keep the marker within the card span
    const top = it.gap ? `${(nowFrac*100).toFixed(2)}%` : `calc((100% - 16px) * ${nowFrac.toFixed(4)})`;
    const marker = i === nowIdx ? nowMarker(now, top) : '';
    if (it.gap){
      rows += `<div class="row gap${pos}">${marker}<div class="tl"></div><div class="rail"></div><div class="gapt">${esc(t('gap'))} · ${dur(Math.round((it.b-it.a)/60000))}</div></div>`;
      return;
    }
    let body = it.cells.map(([ev,c,sp]) => cardHTML(ev, c, sp)).join('');
    const used = new Set(); it.cells.forEach(([,c,sp]) => { for(let j=c;j<c+sp;j++) used.add(j); });
    for (let j=0;j<3;j++) if (!used.has(j)) body += `<div class="ph" style="grid-column:${j+1}"></div>`;
    rows += `<div class="row slot${pos}">${marker}
      <div class="tl"><div class="s">${it.s}</div><div class="e">– ${it.e}</div><span class="d">${dur(toMin(it.e)-toMin(it.s))}</span></div>
      <div class="rail"><i class="dot c-${(it.cells.find(([ev]) => ev.cat !== 'audit') || it.cells[0])[0].cat}"></i></div>
      <div class="cells">${body}</div>
    </div>`;
  });
  if (nowIdx === items.length) rows += `<div class="row nowrow last"><div class="tl"></div><div class="rail"></div>${nowMarker(now,'50%')}</div>`;

  return `<section class="day">
  ${printTitle()}
  <div class="dayhead">
    <div><div class="k">${dayKicker(day)}</div><h2>${longDate(first)}</h2></div>
    <div class="conv"><span class="tzpill">${esc(tzPill())}</span></div>
  </div>
  <div class="row colhead"><div class="cols"><span>SLP</span><span>PEP</span><span>YLP</span></div></div>
  <div class="tree">${rows}</div>
  </section>`;
}

function renderOverview(){
  const tn = todayN(tz);
  const dw = d => ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getUTCDay()];
  const go = (n, isToday) => `<span class="go">DAY ${n}${isToday?' · '+esc(t('today')):''} ›</span>`;
  let left, range;
  if (tz === 'az'){
    range = t('dateRangeAz');
    left = `<h3>${esc(t('itinerary'))}</h3><ul class="trip">` + TRIP.map(([d, label, n]) => {
      const dt = new Date(Date.UTC(2026,9,d));
      return `<li class="${n?'link':''}" ${n?`data-p="${n}"`:''}>
        <span class="dw">${dw(dt)}</span><span class="dt">10/${d}</span>
        <span class="ev">${esc(nm(label))}${n?go(n, n===tn):''}</span></li>`;
    }).join('') + `</ul>`;
  } else {
    range = `${shortDate(dateOf(ONLINE[0]))} – ${shortDate(dateOf(ONLINE[ONLINE.length-1]))}`;
    left = `<h3>${esc(t('bjList'))}</h3><ul class="trip">` + ONLINE.map((day, i) => {
      const dt = dateOf(day);
      const names = [...new Set(day.slots.flatMap(s => s[2]).filter(([ev]) => ev.cat !== 'audit').map(([ev]) => nm(ev)))];
      return `<li class="link" data-p="${i+1}">
        <span class="dw">${dw(dt)}</span><span class="dt">${md(dt)}</span>
        <span class="ev">${day.slots[0][0]} – ${day.slots[day.slots.length-1][1]}${go(day.n, i+1===tn)}<small>${esc(names.slice(0,3).join(' · '))}${names.length>3?esc(t('more')):''}</small></span></li>`;
    }).join('') + `</ul><div class="gapt" style="padding:12px 0 0">${esc(t('bjNote'))}</div>`;
  }
  const counts = COUNTS.map(([label,c]) => `<tr><td>${esc(nm(label))}</td><td>${c}</td></tr>`).join('');
  const legend = LEGEND.map(([c,label]) => `<span class="c-${c}"><i></i>${esc(nm(label))}</span>`).join('');
  return `<section class="day">
  ${printTitle()}
  <div class="dayhead"><div><div class="k">${esc(t('ovKicker'))}</div><h2>${esc(range)}</h2></div>
    <div class="conv"><span class="tzpill">${esc(tzPill())}</span></div></div>
  <div class="ov">
    <div class="panel">${left}</div>
    <div class="stack">
      <div class="panel"><h3>${esc(t('counts'))}</h3><table class="cnt">${counts}</table></div>
      <div class="panel"><h3>${esc(t('legend'))}</h3><div class="legend">${legend}</div></div>
    </div>
  </div></section>`;
}

function pager(){
  return `<div class="pager">
    <button data-step="-1" ${page===0?'disabled':''}>${esc(t('prev'))}</button>
    <button data-step="1" ${page===days().length?'disabled':''}>${esc(t('next'))}</button></div>`;
}

function renderClock(){
  const n = Date.now(), a = wall(n,'az'), b = wall(n,'bj');
  $('#clock').innerHTML = `<span>${esc(t('azClock'))} <b>${md(a)} ${hm(a)}</b></span><span>${esc(t('bjClock'))} <b>${md(b)} ${hm(b)}</b></span>`;
}

function renderMain(withNow = true){
  $('#main').innerHTML = (page === 0 ? renderOverview() : renderDay(days()[page-1], withNow)) + pager();
}
function render(){
  renderChrome();
  renderTabs();
  renderClock();
  renderMain();
}
function setHash(){ history.replaceState(null, '', '#'+tz+(page?'-d'+page:'')); }

// scroll so the current-time marker sits in the upper part of the screen; else to the top of the day
function scrollToNow(fallbackTop){
  const m = $('#nowm');
  const barH = $('.bar').offsetHeight;
  if (m){
    const y = m.getBoundingClientRect().top + scrollY - barH - Math.max(120, (innerHeight - barH) * 0.3);
    scrollTo({top: Math.max(0, y), behavior: 'smooth'});
  } else if (fallbackTop){
    const top = $('#main').getBoundingClientRect().top + scrollY - barH - 8;
    if (scrollY > top) scrollTo({top, behavior:'smooth'});
  }
}

function go(p){
  p = Math.max(0, Math.min(days().length, p));
  if (p === page) return;
  page = p; setHash(); render(); scrollToNow(true);
}

/* ---------- printing: the current page only, without the now-marker ---------- */
let printing = false;
$('#printBtn').addEventListener('click', () => {
  printing = true;
  renderMain(false);
  addEventListener('afterprint', () => { printing = false; renderMain(); }, {once:true});
  window.print();
});

/* ---------- events ---------- */
$('#tzSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.tz === tz) return;
  tz = b.dataset.tz; store.set('tz', tz);
  const tn = todayN(tz);
  page = tn > 0 ? tn : Math.min(page, days().length);
  setHash(); render(); scrollToNow(false);
});
$('#langSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang; store.set('lang', lang); render();
});
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (b) go(+b.dataset.p);
});
$('#main').addEventListener('click', e => {
  const s = e.target.closest('[data-step]'); if (s) return go(page + +s.dataset.step);
  const l = e.target.closest('li[data-p]'); if (l) go(+l.dataset.p);
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowLeft') go(page-1);
  if (e.key === 'ArrowRight') go(page+1);
});
let tx = null, ty = null;
$('#main').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
$('#main').addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.6) go(page + (dx < 0 ? 1 : -1));
  tx = null;
}, {passive:true});
setInterval(() => { renderClock(); if (page && !printing) renderMain(); }, 30000);

const bar = $('.bar');
const onScroll = () => bar.classList.toggle('stuck', bar.getBoundingClientRect().top <= 0 && scrollY > 0);
addEventListener('scroll', onScroll, {passive:true});

render();
requestAnimationFrame(() => { scrollToNow(false); onScroll(); });
})();
</script>
</body>
</html>
